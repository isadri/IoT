---
base_dir: "config"
network_dir: "{{ base_dir }}/network"
values_dir: "{{ base_dir }}/values"
argocd_dir: "{{ base_dir }}/argocd"
app_dir: "{{ base_dir }}/app"

cluster_mapped_ports:
  - port: 80:80

app_namespace: dev

gitlab_domain_name: gitlab.iot.local
gitlab_pages_bucket: gitlab-pages
gitlab_artifacts_bucket: gitlab-artifacts
gitlab_lfs_bucket: gitlab-lfs
gitlab_uploads_bucket: gitlab-uploads
gitlab_packages_bucket: gitlab-packages
buckets: "{{ gitlab_pages_bucket }},{{ gitlab_artifacts_bucket }},{{ gitlab_lfs_bucket }},{{ gitlab_uploads_bucket }},{{ gitlab_packages_bucket }}"
connection_secret_name: minio-connection

postgres_release_name: postgres
psql_host: "{{ postgres_release_name }}-postgresql"
psql_database: gitlabhq_production
psql_username: gitlab
psql_secret_name: postgres-password
psql_password: "{{ vault_psql_password }}"
psql_admin_password: "{{ vault_psql_admin_password }}"

redis_release_name: redis
redis_host: "{{ redis_release_name }}-master"
redis_secret_name: redis-password
redis_password: "{{ vault_redis_password }}"

gateway_name: traefik-gw
gateway_namespace: "{{ app_namespace }}"

gitlab_namespace: gitlab
