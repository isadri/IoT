- hosts: dev
  gather_facts: true

  vars_files:
    - vars/common.yaml
    - vars/app.yaml
    - vars/argocd.yaml
    - vars/gitlab.yaml

  pre_tasks:
    - name: Ensure necessary directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ base_dir }}/app"
        - "{{ base_dir }}/network"

  tasks:
    - ansible.builtin.import_role:
        name: k3d
      tags:
        - k3d
        - cluster

    - name: Register necessary variables
      ansible.builtin.import_tasks:
        file: tasks/register.yaml
      tags:
        - always

    - ansible.builtin.import_role:
        name: argocd
      tags:
        - argocd

    - ansible.builtin.import_role:
        name: postgresql
      tags:
        - postgresql
        - gitlab

    - ansible.builtin.import_role:
        name: redis
      tags:
        - redis
        - gitlab

    - ansible.builtin.import_role:
        name: minio
      tags:
        - minio
        - gitlab

    - name: Copy application manifests
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - src: templates/deployment.yaml.j2
          dest: "{{ app_dir }}/deployment.yaml"
        - src: templates/service.yaml.j2
          dest: "{{ app_dir }}/service.yaml"
      tags:
        - app

    - name: Create application
      ansible.builtin.command: "kubectl apply -f {{ app_dir }}"
      tags:
        - app

    - ansible.builtin.import_role:
        name: network
      tags:
        - network

    - ansible.builtin.import_role:
        name: gitlab
      tags:
        - gitlab
